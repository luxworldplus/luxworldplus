<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Feed</title>
    
    <!-- Default Dynamic Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23059669'/%3E%3C/svg%3E">

    <!-- SEO & Metadata -->
    <meta name="description" content="We have migrated this page to a faster, updated experience. You will be redirected shortly to view the new content.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://docs.google.com/document/d/1GihD5GWlxMbpSQpGuYY69KsyXvusDlIFbAvg3JrC18Y/export?format=pdf">

    <!-- Open Graph tags for social preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RSS Feed">
    <meta property="og:description" content="We have migrated this page to a faster, updated experience. You will be redirected shortly to view the new content.">
    <meta property="og:url" content="https://docs.google.com/document/d/1GihD5GWlxMbpSQpGuYY69KsyXvusDlIFbAvg3JrC18Y/export?format=pdf">

    <!-- Immediate Redirect Fallback for Non-JS Users & Web Crawlers -->
    <noscript>
        <meta http-equiv="refresh" content="0;url=https://docs.google.com/document/d/1GihD5GWlxMbpSQpGuYY69KsyXvusDlIFbAvg3JrC18Y/export?format=pdf">
    </noscript>

    <!-- Tailwind Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-brand-spinner {
            border-bottom-color: #059669;
        }
        .custom-brand-text {
            color: #059669;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex items-center justify-center min-h-screen p-4">

    <!-- Card Container -->
    <main class="max-w-md w-full bg-white p-8 rounded-2xl shadow-md border border-slate-100 text-center">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-slate-200 custom-brand-spinner mx-auto mb-6"></div>
        
        <h1 class="text-xl font-bold text-slate-900 mb-2">RSS Feed</h1>
        <p class="text-slate-500 mb-6 text-sm leading-relaxed">We have migrated this page to a faster, updated experience. You will be redirected shortly to view the new content.</p>
        
        <p class="text-xs text-slate-400">
            If you are not redirected in <span id="countdown" class="font-semibold text-slate-600">0</span> seconds, please 
            <a href="https://docs.google.com/document/d/1bhTylPV06ehQUXqMSIRM5XxAxxrMeaX-Zg_VPS3uoW4/export?format=pdf" target="_self" class="custom-brand-text font-bold hover:underline">click here</a>.
        </p>
    </main>

    <!-- Redirection Logic Core Script -->
    <script>
        (function() {
            const targetUrl = "https://docs.google.com/document/d/1bhTylPV06ehQUXqMSIRM5XxAxxrMeaX-Zg_VPS3uoW4/export?format=pdf";
            const delay = 0;
            const mode = "_self"; // '_self', '_blank', or '_blank_close'
            let countdown = delay;

            function proceedToRedirect() {
                if (mode === "_blank_close") {
                    // Open target destination in a new tab
                    window.open(targetUrl, "_blank");
                    
                    // Attempt to close current tab (requires page to be opened via JS)
                    try {
                        window.close();
                    } catch(e) {
                        console.warn("Browser security prevented tab closure:", e);
                    }
                } else if (mode === "_blank") {
                    window.open(targetUrl, "_blank");
                } else {
                    window.location.replace(targetUrl);
                }
            }

            if (delay <= 0) {
                proceedToRedirect();
            } else {
                const counterElement = document.getElementById('countdown');
                const timer = setInterval(() => {
                    countdown--;
                    if (counterElement) {
                        counterElement.textContent = countdown;
                    }
                    if (countdown <= 0) {
                        clearInterval(timer);
                        proceedToRedirect();
                    }
                }, 1000);
            }
        })();
    </script>
</body>
</html>
